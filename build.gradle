plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nivium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Developer benchmark: auto-joins run/saves/nivium-bench, records frames, writes run/nivium-bench/<label>.json, quits.
		//   gradlew runBenchClient -PbenchLabel=base -PbenchSeconds=60 -PbenchJvmArgs="-Dnivium.opt.x=false"
		benchClient {
			inherit client
			configName = "Nivium benchmark"
			ideConfigGenerated false
			programArgs "--quickPlaySingleplayer", "nivium-bench"
			vmArg "-Xmx2G"
			vmArg "-Dnivium.bench.seconds=" + (project.findProperty('benchSeconds') ?: '60')
			vmArg "-Dnivium.bench.label=" + (project.findProperty('benchLabel') ?: 'run')
			((project.findProperty('benchJvmArgs') ?: '') as String).split(' ').findAll { !it.isEmpty() }.each { vmArg it }
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium is only put on the dev client runtime so `runClient` exercises Nivium next to Sodium.
	// Nivium does not compile against Sodium and must keep working without it.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// LGPL-3.0 incorporates GPL-3.0, so both texts ship with the binary.
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("COPYING") {
		rename { "${it}_$projectName" }
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
